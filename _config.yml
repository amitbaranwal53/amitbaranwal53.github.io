remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "dark"

title: "Amit Baranwal"
subtitle: "Senior Engineer at Amazon · Writing about AI systems & architecture"
name: "Amit Baranwal"
description: "AI-native architect who builds intelligent developer tools. Writing about AI systems, architecture, and building in public."
url: "https://amitbaranwal53.github.io"
baseurl: ""

author:
  name: "Amit Baranwal"
  avatar: "/assets/images/avatar.jpeg"
  bio: "AI-native architect who builds intelligent developer tools"
  location: "Bengaluru, India"
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/amitbaranwal53"
    - label: "LinkedIn"
      icon: "fab fa-fw fa-linkedin"
      url: "https://www.linkedin.com/in/amitbaranwal53/"

search: true
breadcrumbs: true

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      show_date: true
      toc: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

footer:
